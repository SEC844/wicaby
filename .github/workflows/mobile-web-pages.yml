name: Phone web app (Pages)

# The phone web app (apps/mobile-web): checks, the build, then the static site on GitHub Pages. Only the app shell
# is published there; the media server is reached from the phone directly, never through Pages.

on:
  push:
    branches: [feat/mobile-web]
    paths:
      - 'apps/mobile-web/**'
      - 'apps/tv-web/src/**'
      - 'apps/tv-web/scripts/android-strings.mjs'
      - 'apps/desktop/src/shared/**'
      - 'apps/desktop/src/renderer/lib/**'
      - 'apps/desktop/src/renderer/tokens.css'
      - 'apps/android/*/src/main/res/values*/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-web-pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check -w apps/mobile-web

      - name: Build
        run: npm run build -w apps/mobile-web

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/mobile-web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
