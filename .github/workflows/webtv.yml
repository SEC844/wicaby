name: Web TV

# The web TV app (docs/webtv.md) on every push to main: the LG webOS .ipk and the unsigned Samsung Tizen .wgt as
# workflow artifacts (never attached to a GitHub Release), and the browser demo on GitHub Pages (built-in demo
# server, Blender open movies with CC BY artwork, a generated test clip). Pages needs Settings > Pages > Source:
# GitHub Actions once (and, for a private repository, a plan that offers Pages); until then the deploy job is
# skipped and the packages are still built.

on:
  push:
    branches: [main]
    paths:
      - 'apps/webtv/**'
      - 'apps/desktop/src/renderer/**'
      - 'apps/desktop/src/shared/**'
      - 'apps/desktop/svelte.config.js'
      - 'tools/release/licenses.mjs'
      - 'tools/mock-server/**'
      - 'tools/checks/webtv-check.mjs'
      - 'brand/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/webtv.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webtv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (webOS .ipk, Tizen .wgt, Pages demo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # svelte-check over the web TV entry and the desktop renderer it imports.
      - name: Type-check
        run: npm run check:webtv

      # webtv-check after the build also parses the bundle as ES2019 (Chromium 79).
      - name: Build the TV app, check it and pack it
        run: |
          npm run build:webtv
          node tools/checks/webtv-check.mjs
          npm run package:webtv

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wicaby-webtv-${{ github.sha }}
          path: |
            apps/webtv/dist/packages/*.ipk
            apps/webtv/dist/packages/*.wgt
          if-no-files-found: error
          retention-days: 30

      # The demo catalogue comes from tools/mock-server (MOCK_DATASET=demo) on 127.0.0.1 only.
      - name: Build the Pages demo
        run: npm run build:webtv-demo

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/webtv/dist/demo

  pages:
    name: Deploy the demo to GitHub Pages
    needs: build
    if: github.event.repository.has_pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
