# This code repository is private: the forms here are for collaborators only. Public users
# report bugs and vulnerabilities on the public WicaebethTheo/wicaby-releases repository
# (copy these ISSUE_TEMPLATE files there, and enable Settings > Code security >
# "Private vulnerability reporting" on it, so the advisory link below works).
blank_issues_enabled: false
contact_links:
