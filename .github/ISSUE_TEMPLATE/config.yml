    url: https://github.com/WicaebethTheo/wicaby-releases/security/advisories/new
    about: Please report security issues privately (see SECURITY.md), not in an issue.
  - name: Public bug reports and feature requests
    url: https://github.com/WicaebethTheo/wicaby-releases/issues/new/choose
    about: Not a collaborator on this private repository? Open your issue on wicaby-releases.
  - name: Downloads
    url: https://github.com/WicaebethTheo/wicaby-releases/releases/latest
    about: Latest Windows installer and Android APKs.
